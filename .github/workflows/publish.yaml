name: Docker Publish

on:
  workflow_call:
    inputs:
      tag:
        description: "Docker image tag"
        required: false
        type: string
        default: "latest"

jobs:
  publish:
    name: Publish images to Docker Hub
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inventory
            dockerfile: ./deploydocker/inventory/Dockerfile
          - name: order
            dockerfile: ./deploy/docker/order/Dockerfile
          - image: order-migrate
            dockerfile: ./deploy/docker/order/migrate.Dockerfile
          - name: payment
            dockerfile: ./deploy/docker/payment/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:${{ inputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:latest
