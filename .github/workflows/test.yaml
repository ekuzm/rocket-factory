name: Test

on:
  workflow_call:

jobs:
  test:
    name: Testing all go modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: "1.25.6"

      - name: Set up Task-tool to work with Taskfile
        uses: go-task/setup-task@v1.0.0
        with:
          version: 3.47.0

      - name: Run tests via Taskfile
        run: task test
