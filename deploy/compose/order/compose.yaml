services:
    pg:
        image: postgres:18-alpine
        container_name: order-service-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - ${POSTGRES_PORT}:5432
        volumes:
            - order-service-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - rocket-factory-net

    migrate:
        container_name: order-service-migrate
        build:
            context: ../../..
            dockerfile: ./deploy/docker/order/migrate.Dockerfile
        environment:
            - GOOSE_DRIVER=${GOOSE_DRIVER}
            - GOOSE_DBSTRING=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
            - GOOSE_MIGRATION_DIR=${GOOSE_MIGRATION_DIR}
        depends_on:
            pg:
                condition: service_healthy
        restart: on-failure
        networks:
            - rocket-factory-net

    order-service:
        container_name: order-service
        build:
            context: ../../..
            dockerfile: ./deploy/docker/order/Dockerfile
        environment:
            - DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
        ports:
            - "${ORDER_SERVICE_PORT}:80"
        depends_on:
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            - rocket-factory-net

networks:
    rocket-factory-net:
        external: true

volumes:
    order-service-data:
