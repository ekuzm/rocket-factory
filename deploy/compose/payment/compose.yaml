services:
    payment-service:
        container_name: payment-service
        env_file: ../../env/payment/.env
        build:
            context: ../../..
            dockerfile: ./deploy/docker/payment/Dockerfile
        ports:
            - ${SERVICE_PORT}:50052
        restart: unless-stopped
        networks:
            - rocket-factory-net

networks:
    rocket-factory-net:
        external: true
