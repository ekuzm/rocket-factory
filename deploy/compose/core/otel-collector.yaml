receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s
    send_batch_max_size: 1000

exporters:
  otlp:
    endpoint: "${env:JAEGER_HOST}:${env:JAEGER_PORT}"
    tls:
      insecure: true
    retry_on_failure:
      enabled: true

  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]
