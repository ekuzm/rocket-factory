type: object
required:
  - uuid
  - user_uuid
  - part_uuids
  - total_price
  - status
properties:
  uuid:
    type: string
    format: uuid
    description: Order UUID
    example: "80205bfe-1052-4d6d-ab83-7c68c14b87b1"
  user_uuid:
    type: string
    format: uuid
    description: User UUID
    example: "80205bfe-1052-4d6d-ab85-7c68c14b87b1"
  part_uuids:
    type: array
    description: Part UUIDs
    items:
      type: string
      format: uuid
    example:
      - "80205bfe-1052-4d6d-ab85-7c68c14b87b1"
      - "80205bfe-1052-4d6d-ab85-7c68c14b87b2"
  total_price:
    type: number
    format: double
    description: Total price for order
    example: 123.45
  transaction_uuid:
    type: string
    format: uuid
    description: Transaction UUID
    example: "80205bfe-1052-4d6d-ab83-7c68c14b87b1"
  payment_method:
    $ref: "../enums/payment_method.yaml"
  status:
    $ref: "../enums/order_status.yaml"
    default: PENDING_PAYMENT
    example: "PAID"
