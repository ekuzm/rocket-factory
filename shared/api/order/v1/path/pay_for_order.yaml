parameters:
  - $ref: ../params/order_uuid.yaml
post:
  summary: Performs payment for a previously created order
  operationId: PayForOrder
  tags:
    - Order
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/pay_for_order/request.yaml
  responses:
    "200":
      description: Successfully paid for order 
      content:
        application/json:
          schema:
            $ref: ../components/pay_for_order/response.yaml
    "404":
      description: Order UUID was not found
      content:
        application/json:
          schema:
            $ref: ../components/errors/not_found_error.yaml
    "400":
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: ../components/errors/bad_request_error.yaml
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/errors/internal_server_error.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/errors/generic_error.yaml
