syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ekuzm/rocket-factory/shared/pkg/proto/inventory/v1;inventory_v1";

service InventoryService {
  rpc GetPart(GetPartRequest) returns (GetPartResponse);
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// GetPartRequest contains the ID of the part to retrieve.
message GetPartRequest {
  string uuid = 1;
}

// GetPartResponse contains the requested part information.
message GetPartResponse {
  Part part = 1;
}

// Part describes a single part in the inventory.
message Part {
  string uuid = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int64 stock_quantity = 5;
  Category category = 6;
  Dimensions dimensions = 7;
  Manufacturer manufacturer = 8;
  repeated string tags = 9;
  map<string, Value> metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// Category represents the classification of a part.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_ENGINE = 1;
  CATEGORY_FUEL = 2;
  CATEGORY_PORTHOLE = 3;
  CATEGORY_WING = 4;
}

// Dimensions represent the physical size of a part.
message Dimensions {
  double length = 1;
  double width = 2;
  double height = 3;
  double weight = 4;
}

// Manufacturer contains information about who produced the part.
message Manufacturer {
  string name = 1;
  string country = 2;
  string website = 3;
}

// Value describes the monetary value of the part.
message Value {
  oneof value {
    string string_value = 1;
    int64 int64_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

// ListPartsRequest contains filters for listing parts.
message ListPartsRequest {
  PartsFilter filter = 1;
}

// ListPartsResponse contains a list of parts.
message ListPartsResponse {
  repeated Part parts = 1;
}

// PartsFilter specifies criteria for filtering parts.
message PartsFilter {
  repeated string uuids = 1;
  repeated string names = 2;
  repeated Category categories = 3;
  repeated string manufacturer_countries = 4;
  repeated string tags = 5;
}
