# template: testify
dir: "{{.InterfaceDir}}/mock"
filename: "mock_{{.InterfaceName | snakecase}}.go"
pkgname: "mock"
structname: "{{.InterfaceName}}"

packages:
    github.com/ekuzm/rocket-factory/inventory/internal/api/inventory/v1:
        config:
            include-interface-regex: ".*Service"
    github.com/ekuzm/rocket-factory/inventory/internal/service/inventory:
        config:
            include-interface-regex: ".*Repository || .*Port"
    github.com/ekuzm/rocket-factory/order/internal/api/order/v1:
        config:
            include-interface-regex: ".*Service"
    github.com/ekuzm/rocket-factory/order/internal/service/order:
        config:
            include-interface-regex: ".*Repository || .*Port"
    github.com/ekuzm/rocket-factory/payment/internal/api/payment/v1:
        config:
            include-interface-regex: ".*Service"
    github.com/ekuzm/rocket-factory/payment/internal/service/payment:
        config:
            include-interface-regex: ".*Repository || .*Port"
