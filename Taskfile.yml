version: "3"

vars:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "v2.7.1"
  GCI_VERSION: "v0.13.7"
  GOFUMPT_VERSION: "v0.9.2"
  OGEN_VERSION: "v1.18.0"
  YQ_VERSION: "v4.49.2"

  BIN_DIR: "{{.ROOT_DIR}}/bin"
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"
  GCI: "{{.BIN_DIR}}/gci"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt"
  OGEN: "{{.BIN_DIR}}/ogen"
  YQ: "{{.BIN_DIR}}/yq"
  OGEN_API_FILES: "{{.ROOT_DIR}}/shared/api/order/v1/"
  OGEN_CONFIG: "{{.ROOT_DIR}}/ogen.yaml"
  OPEN_API_ORDER_V1: "{{.ROOT_DIR}}/shared/api/order/v1/order.openapi.yaml"

  MODULES: inventory order payment

tasks:
  install-formatters:
    desc: "Installing formatters gci and gofumpt in ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Formatting all projects with gofumpt + gci, exclude mocks"
    deps: [install-formatters]
    cmds:
      - |
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
          fi
        done
      - |
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/ekuzm/rocket-factory)" {} +
          fi
        done

  install-golangci-lint:
    desc: "Installing golangci-lint in bin directory"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Run golangci-lint on the all modules"
    deps: [install-golangci-lint]
    cmds:
      - |
        set -e
        ERR=0
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            {{.GOLANGCI_LINT}} run $mod/... --config=.golangci.yml || ERR=1
          fi
        done
        exit $ERR
  ogen:install:
    cmds:
      - |
        [ -f {{.OGEN}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
        }
  yq:install:
    desc: "Installing yq in bin directory"
    cmds:
      - |
        [ -f {{.YQ}} ] || {
          GOBIN={{.BIN_DIR}} go install github.com/mikefarah/yq/v4@{{.YQ_VERSION}}
        }

  ogen:gen:
    deps: [ogen:install, yq:install]
    desc: "Generate code form openAPI declaration"
    cmds:
      - |
        target=$({{.YQ}} e '."x-ogen".target' {{.OPEN_API_ORDER_V1}})
        package=$({{.YQ}} e '."x-ogen".package' {{.OPEN_API_ORDER_V1}})
        echo "target=$target"
        echo "package=$package"
        {{.OGEN}} --config {{.OGEN_CONFIG}} --target "$target" --package "$package"  --clean {{.OPEN_API_ORDER_V1}}
